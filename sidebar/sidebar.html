<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Local</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="top-bar">
    <span class="brand">Gemini Local</span>
    <select id="model-select"><option value="">Auto Model</option></select>
    <div class="header-actions">
      <button type="button" id="new-chat-btn" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3e3e3" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" id="options-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3e3e3" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="context-bar">
    <input type="checkbox" id="include-page-toggle" checked>
    <span id="page-status">Reading current tab...</span>
    <button type="button" id="refresh-page-btn" title="Refresh Page Context">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e3e3e3" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <main id="chat-messages">
    <div id="welcome-state">
      <h2>Hi, how can I help?</h2>
      <div class="chips">
        <button type="button" class="prompt-chip">Summarize this page</button>
        <button type="button" class="prompt-chip">Key takeaways</button>
        <button type="button" class="prompt-chip">Explain simply</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div id="attachment-list" class="attachment-list" hidden></div>
    <textarea id="user-input" rows="2" placeholder="Ask Gemini Local..."></textarea>
    <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.sql,.log,image/*" hidden>
    <div class="toolbar">
      <button type="button" id="attach-btn" title="Attach PDF, DOCX, text, or image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e3e3e3" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <div class="send-group">
        <button type="button" id="send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0e0e10" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button type="button" id="stop-btn" title="Stop" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#e3e3e3"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="file-parser.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
